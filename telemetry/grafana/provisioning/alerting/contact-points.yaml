# The webhook the alert posts to (#57). The URL comes from RESPONDER_URL, set on
# the Grafana service in docker-compose.telemetry.yml (default: the on-call
# responder of #58 on the host). Change the variable, not this file.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: responder-webhook
    receivers:
      - uid: responder-webhook
        type: webhook
        settings:
          url: ${RESPONDER_URL}
          httpMethod: POST
        # Resolve messages stay on: a resolved notification follows the firing one.
        disableResolveMessage: false
