[project]
name = "tennis-prediction-game-backend"
version = "0.1.0"
description = "FastAPI backend for the tennis prediction game"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; reformatting them by hand only invites a diff the next
# autogenerate will undo.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
